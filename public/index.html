<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Commera2</title>
    <link rel="icon" type="image/png" href="/brand/commera2-icon-v1.png" />
    <link rel="apple-touch-icon" href="/brand/commera2-icon-v1.png" />
    <meta name="theme-color" content="#087f83" />
    <link rel="stylesheet" href="/styles.css?v=workspace-polish-3" />
    <link rel="stylesheet" href="/page-blocks.css" />
    <link rel="stylesheet" href="/online-store.css?v=theme-editor-4" />
    <link rel="stylesheet" href="/reviews-ui.css?v=reviews-ui-6" />
    <link rel="stylesheet" href="/merchant-ui.css?v=merchant-5" />
  </head>
  <body>
    <aside id="app-sidebar" class="app-sidebar" aria-label="Merchant workspace">
      <a class="brand" id="brand-home" href="/overview" aria-label="Commera2 home">
        <img class="commera-wordmark" src="/brand/commera2-logo-v1.png" width="2172" height="724" alt="Commera2">
      </a>
      <div class="store-switcher">
        <label class="store-label">Your store<select id="store-select" aria-label="Switch store"></select></label>
        <div class="store-switcher-current" id="store-switcher-current" hidden><span class="store-switcher-copy"><small>Your store</small><strong></strong></span></div>
        <button class="store-switcher-trigger" id="store-switcher-trigger" type="button" aria-expanded="false" aria-controls="store-switcher-options" hidden><span class="store-switcher-copy"><small>Switch store</small><strong></strong></span><img class="workspace-icon" src="/icons/chevron-right.svg" alt=""></button>
        <div class="store-switcher-options" id="store-switcher-options" role="group" aria-label="Your stores" hidden></div>
      </div>
      <nav aria-label="Main navigation">
        <span class="nav-section-label">Workspace</span>
        <button class="active" data-view="home"><img class="nav-icon" src="/icons/house.svg" alt="">Home</button>
        <button data-view="orders"><img class="nav-icon" src="/icons/shopping-bag.svg" alt="">Orders</button>
        <button data-view="products"><img class="nav-icon" src="/icons/package.svg" alt="">Products</button>
        <button data-view="customers"><img class="nav-icon" src="/icons/users.svg" alt="">Customers</button>
        <span class="nav-section-label">Storefront</span>
        <button data-view="online-store"><img class="nav-icon" src="/icons/store.svg" alt="">Store design</button>
        <div class="online-store-subnav" aria-label="Online Store navigation">
          <button data-route="/online-store/themes">Design</button>
          <button data-route="/online-store/pages">Pages</button>
          <button data-route="/online-store/preferences">Preferences</button>
        </div>
        <button data-view="pages"><img class="nav-icon" src="/icons/panels-top-left.svg" alt="">Product pages</button>
        <button data-view="reviews"><img class="nav-icon" src="/icons/star.svg" alt="">Reviews</button>
        <span class="nav-section-label">Business</span>
        <button data-view="visitors"><img class="nav-icon" src="/icons/activity.svg" alt="">Live visitors</button>
        <button data-view="policies"><img class="nav-icon" src="/icons/shield-check.svg" alt="">Store policies</button>
        <button data-view="settings"><img class="nav-icon" src="/icons/settings-2.svg" alt="">Settings</button>
      </nav>
      <div class="sidebar-actions">
        <a id="account-link" class="account-link" href="/account"><strong id="account-name">Your account</strong><span id="account-email"></span><small>Account &amp; security</small></a>
        <button id="new-store" class="outline"><img class="nav-icon" src="/icons/plus.svg" alt="">New store</button>
        <button id="logout" class="outline"><img class="nav-icon" src="/icons/log-out.svg" alt="">Sign out</button>
      </div>
    </aside>
    <button
      id="sidebar-backdrop"
      class="sidebar-backdrop"
      type="button"
      aria-label="Close navigation"
    ></button>
    <main>
      <div class="mobile-appbar">
        <button
          id="mobile-menu"
          type="button"
          aria-label="Open navigation"
          aria-controls="app-sidebar"
          aria-expanded="false"
        >
          <img class="workspace-icon" src="/icons/menu.svg" alt=""></button
        ><a id="mobile-brand-home" href="/overview" aria-label="Commera2 home"><img class="commera-wordmark" src="/brand/commera2-logo-v1.png" width="2172" height="724" alt="Commera2"></a><a id="mobile-account-link" href="/account" aria-label="Account and security">Account</a><strong id="mobile-store-name" hidden>Store</strong>
      </div>
      <div class="workspace-topbar">
        <div class="workspace-location"><small>Workspace</small><strong id="workspace-store-name">Your store</strong></div>
        <div class="workspace-topbar-actions"><button type="button" class="workspace-search-button" data-workspace-search><img class="workspace-icon" src="/icons/search.svg" alt=""><span>Find a page</span></button><a id="workspace-store-link" class="workspace-store-link" target="_blank" rel="noopener" hidden>View store<img class="workspace-icon" src="/icons/arrow-up-right.svg" alt=""></a></div>
      </div>
      <header class="page-header">
        <div>
          <h1 id="page-title">Overview</h1>
          <p id="page-description">A clear view of this store.</p>
        </div>
        <div id="page-actions" class="page-actions"></div>
      </header>
      <section id="content"></section>
    </main>
    <dialog id="workspace-search" class="workspace-search-dialog" aria-label="Find a page">
      <div class="workspace-search-input"><img class="workspace-icon" src="/icons/search.svg" alt=""><input id="workspace-search-input" type="search" placeholder="Search pages, settings and actions" aria-label="Search workspace pages" autocomplete="off"><button id="workspace-search-close" class="icon-button" type="button" aria-label="Close search" title="Close search"><img class="workspace-icon" src="/icons/x.svg" alt=""></button></div>
      <div id="workspace-search-results" class="workspace-search-results"></div>
    </dialog>
    <dialog id="modal" aria-label="Application dialog">
      <form id="modal-form" method="dialog">
        <!-- prettier-ignore -->
        <button class="close" id="modal-close" type="button" aria-label="Close">×</button>
        <div id="modal-content"></div>
      </form>
    </dialog>
    <div id="floating-layer-root" popover="manual"></div>
    <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/app.js?v=ui-overlays-17"></script>
  </body>
</html>
